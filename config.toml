baseURL = "https://miphphuong-eng.github.io/NguyenMinhPhuong_Workshop/"
languageCode = "en-us"
title = "Internship Worklog"

theme = "hugo-theme-learn"

relativeURLs = false
canonifyURLs = false
uglyURLs = false

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  themeVariant = "blue"
  showVisitedLinks = true
  disableSearch = false
  disableExplicitIndexHeading = true

[languages]

  [languages.en]
    title = "Internship Worklog"
    languageName = "English"
    languageCode = "en"
    weight = 1
    [languages.en.params]
      themeVariant = "blue"

  [languages.vi]
    title = "Nhật ký Thực tập"
    languageName = "Tiếng Việt"
    languageCode = "vi"
    weight = 2
    [languages.vi.params]
      themeVariant = "blue"
