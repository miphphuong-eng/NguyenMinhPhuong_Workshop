baseURL = 'https://miphphuong-eng.github.io/NguyenMinhPhuong_Workshop/'
languageCode = 'vi'
title = 'Nguyen Minh Phuong - Internship Workshop'
theme = 'hugo-theme-learn'

# Ép Hugo tự động nối đúng đường dẫn CSS/JS trên GitHub Pages
relativeURLs = true
canonifyURLs = false
uglyURLs = false

defaultContentLanguage = 'vi'
defaultContentLanguageInSubdir = false

[languages]
  [languages.vi]
    title = 'Nhật ký Thực tập'
    weight = 1
    languageName = 'Tiếng Việt'

  [languages.en]
    title = 'Worklog'
    weight = 2
    languageName = 'English'

[params]
  themeVariant = 'blue'
  showVisitedLinks = true
  disableSearch = false
