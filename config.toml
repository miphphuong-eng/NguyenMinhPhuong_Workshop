baseURL = 'https://miphphuong-eng.github.io/NguyenMinhPhuong_Workshop/'
languageCode = 'vi'
title = 'Nguyen Minh Phuong - Internship Workshop'
theme = 'hugo-theme-learn'

# Các cấu hình bắt buộc để tránh lỗi đường dẫn CSS/JS trên GitHub Pages
relativeURLs = true
canonifyURLs = false
uglyURLs = false

# Cấu hình ngôn ngữ mặc định và đa ngôn ngữ (Multilingual)
defaultContentLanguage = 'vi'
defaultContentLanguageInSubdir = false

[languages]
  [languages.vi]
    title = 'Nhật ký Thực tập'
    weight = 1
    languageName = 'Tiếng Việt'

  [languages.en]
    title = 'Worklog'
    weight = 2
    languageName = 'English'

# Cấu hình tham số giao diện Learn (Sidebar, Search, Toc...)
[params]
  themeVariant = 'blue' # Các màu hỗ trợ: blue, green, red, grey, orange
  editURL = ''
  showVisitedLinks = true
  disableSearch = false
  disableHeaderMenu = false
  disableShortcutsTitle = false
  disableLanguageSwitchingButton = false
  clearReadingHistory = false

# Thanh Menu phụ / Shortlinks bên trái sidebar
[[menu.shortcuts]]
  name = '<i class="fab fa-github"></i> GitHub Repo'
  url = 'https://github.com/miphphuong-eng/NguyenMinhPhuong_Workshop'
  weight = 1
